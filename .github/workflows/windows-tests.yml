name: Windows UI Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  counter-tests:
    name: Counter UI tests
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/flaui-demo.Tests.csproj

      - name: Build
        run: dotnet build tests/flaui-demo.Tests.csproj -c Release --no-restore

      - name: Run CounterTests
        run: >
          dotnet test tests/flaui-demo.Tests.csproj
          -c Release
          --no-build
          --filter "FullyQualifiedName~CounterTests"
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=counter-tests.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counter-test-results
          path: TestResults
          if-no-files-found: warn
